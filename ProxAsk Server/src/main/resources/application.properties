# Application name
spring.application.name=proxask

# Server Port
server.port=8080

# Context Path for API
# server.servlet.context-path=/

# MySql Database localhost configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/proxask_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${MYSQL_USERNAME:root}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${MYSQL_PASSWORD:rAjkumAr031@@#}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Properties
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=true

# MongoDB database configuration
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/proxask_db}

## ===================== JWT SETTINGS =====================
app.jwt.secret=${JWT_SECRET:}
secretKey=${app.jwt.secret}
app.jwt.expiration=86400000

## ===================== APP BASE URL =====================
app.backend.base-url=${BACKEND_BASE_URL:http://localhost:8080}

## ===================== LOGGING =====================
logging.level.org.springframework.security=WARN
logging.level.com.proxask=INFO
