# Application name
spring.application.name=proxask

# Server Port
server.port=8080

# Context Path for API
# server.servlet.context-path=/

# MySql Database configuration with safe fallback defaults
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${MYSQL_USERNAME}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${MYSQL_PASSWORD}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Properties
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=true

# MongoDB Database Configuration with Atlas-resilient connection settings
spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.database=${MONGODB_DATABASE:proxask_db}
spring.data.mongodb.auto-index-creation=true

## ===================== JWT SETTINGS =====================
app.jwt.secret=${JWT_SECRET}
secretKey=${app.jwt.secret}
app.jwt.expiration=900000

## ===================== APP BASE URL =====================
app.backend.base-url=${BACKEND_BASE_URL}

## ===================== ACTUATOR & HEALTH MONITORING =====================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.endpoint.health.logging.slow-indicator-threshold=20s
management.health.mongo.enabled=true

## ===================== LOGGING =====================
logging.level.org.springframework.security=WARN
logging.level.com.proxask=INFO
logging.level.org.mongodb.driver=INFO
